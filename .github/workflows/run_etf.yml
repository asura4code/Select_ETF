name: Daily ETF Screening & Notification

on:
  schedule:
    # UTC 時間 04:26 對應台灣時間(UTC+8) 12:26 (每天)
    - cron: '26 4 * * *'
  workflow_dispatch: # 允許在網頁介面隨時手動點擊觸發

jobs:
  run-screening:
    runs-on: ubuntu-22.04

    steps:
      - name: 簽出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # cache: 'pip'

      - name: 安裝 TA-Lib 底層 C-Library
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: 安裝 Python 相依套件
        env:
          CFLAGS: "-Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-int-conversion"
        run: |
          python -m pip install --upgrade pip
          # 1. 先安裝 wheel 與 1.x 版本的 numpy
          pip install wheel "numpy<2"
          # 2. 關閉 build-isolation，強制使用當前環境的 numpy 1.x 與 CFLAGS 編譯
          pip install --no-build-isolation ta-lib
          # 3. 安裝其餘專案相依套件
          pip install -r requirements.txt

      - name: 執行 ETF 模型運算與推播
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FM_DL_TOKEN: ${{ secrets.FM_DL_TOKEN }}
        run: |
          python ETF_Model_v8_雲端版.py

      - name: 將更新後的 Excel 存回 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ETF動態清單.xlsx
          # 檢查是否有檔案更新，若有變動才 commit，避免無更動時報錯
          git diff --staged --quiet || (git commit -m "Auto-update ETF list [$(date +'%Y-%m-%d')]" && git push)
